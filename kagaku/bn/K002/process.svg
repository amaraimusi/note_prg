<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>সিলিকোন উৎপাদন</title><rect width="1000" height="560" fill="#fffdf8"/><style>text{font-family:system-ui,"Nirmala UI","Yu Gothic",sans-serif;fill:#203a3a}.label{font-size:25px}.small{font-size:21px}.chem{font-size:29px;font-family:Arial,sans-serif}</style><text x="500" y="55" text-anchor="middle" class="label">কাঁচামাল থেকে সিলিকোন</text><rect x="200" y="90" width="600" height="100" rx="15" fill="#e5efe9"/><text x="500" y="129" text-anchor="middle" class="chem">Si + CH₃Cl</text><text x="500" y="167" text-anchor="middle" class="small">সিলিকন + ক্লোরোমিথেন</text><path d="M500 193v30m-8-9 8 9 8-9" fill="none" stroke="#126c65" stroke-width="3"/><text x="760" y="220" text-anchor="middle" class="small">অনুঘটক / পৃথকীকরণ</text><rect x="200" y="235" width="600" height="100" rx="15" fill="#e5efe9"/><text x="500" y="274" text-anchor="middle" class="chem">(CH₃)₂SiCl₂</text><text x="500" y="312" text-anchor="middle" class="small">প্রধান মধ্যবর্তী যৌগ</text><path d="M500 338v30m-8-9 8 9 8-9" fill="none" stroke="#126c65" stroke-width="3"/><text x="760" y="365" text-anchor="middle" class="small">জলবিশ্লেষণ / পলিমারকরণ</text><rect x="200" y="380" width="600" height="100" rx="15" fill="#e5efe9"/><text x="500" y="419" text-anchor="middle" class="chem">[–Si(CH₃)₂–O–]ₙ</text><text x="500" y="457" text-anchor="middle" class="small">পলিমার / PDMS</text><text x="500" y="535" text-anchor="middle" class="small">শিল্পপদ্ধতির সারাংশ / ঘরে সংশ্লেষণের নির্দেশনা নয়</text></svg>