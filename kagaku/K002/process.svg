<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>シリコーンの製造</title><rect width="1000" height="560" fill="#fffdf8"/><style>text{font-family:system-ui,"Nirmala UI","Yu Gothic",sans-serif;fill:#203a3a}.label{font-size:25px}.small{font-size:21px}.chem{font-size:29px;font-family:Arial,sans-serif}</style><text x="500" y="55" text-anchor="middle" class="label">原料からシリコーンへ</text><rect x="200" y="90" width="600" height="100" rx="15" fill="#e5efe9"/><text x="500" y="129" text-anchor="middle" class="chem">Si + CH₃Cl</text><text x="500" y="167" text-anchor="middle" class="small">金属ケイ素 ＋ クロロメタン</text><path d="M500 193v30m-8-9 8 9 8-9" fill="none" stroke="#126c65" stroke-width="3"/><text x="760" y="220" text-anchor="middle" class="small">触媒・反応・分離</text><rect x="200" y="235" width="600" height="100" rx="15" fill="#e5efe9"/><text x="500" y="274" text-anchor="middle" class="chem">(CH₃)₂SiCl₂</text><text x="500" y="312" text-anchor="middle" class="small">主要な中間体</text><path d="M500 338v30m-8-9 8 9 8-9" fill="none" stroke="#126c65" stroke-width="3"/><text x="760" y="365" text-anchor="middle" class="small">加水分解・縮合・重合</text><rect x="200" y="380" width="600" height="100" rx="15" fill="#e5efe9"/><text x="500" y="419" text-anchor="middle" class="chem">[–Si(CH₃)₂–O–]ₙ</text><text x="500" y="457" text-anchor="middle" class="small">ポリマー／PDMS</text><text x="500" y="535" text-anchor="middle" class="small">工業工程の概略／家庭での合成手順ではありません</text></svg>