<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>表面と水滴</title><rect width="1000" height="560" fill="#fffdf8"/><style>text{font-family:system-ui,"Nirmala UI","Yu Gothic",sans-serif;fill:#203a3a}.label{font-size:25px}.small{font-size:21px}.chem{font-size:29px;font-family:Arial,sans-serif}</style><text x="500" y="55" text-anchor="middle" class="label">水滴の形は、表面で変わる</text><path d="M110 305 A140 140 0 1 1 390 305Z" fill="#a9d9e7" stroke="#427e99" stroke-width="3"/><path d="M600 305 Q750 205 900 305Z" fill="#a9d9e7" stroke="#427e99" stroke-width="3"/><rect x="60" y="310" width="380" height="62" rx="6" fill="#dce9df"/><rect x="560" y="310" width="380" height="62" rx="6" fill="#dce9df"/><text x="110" y="353" text-anchor="middle" class="chem">CH₃</text><text x="200" y="353" text-anchor="middle" class="chem">CH₃</text><text x="290" y="353" text-anchor="middle" class="chem">CH₃</text><text x="380" y="353" text-anchor="middle" class="chem">CH₃</text><text x="610" y="353" text-anchor="middle" class="chem">OH</text><text x="700" y="353" text-anchor="middle" class="chem">OH</text><text x="790" y="353" text-anchor="middle" class="chem">OH</text><text x="880" y="353" text-anchor="middle" class="chem">OH</text><text x="250" y="425" text-anchor="middle" class="label">メチル基が多い表面</text><text x="750" y="425" text-anchor="middle" class="label">親水性の表面</text><text x="250" y="468" text-anchor="middle" class="small">水は広がりにくい</text><text x="750" y="468" text-anchor="middle" class="small">水が広がりやすい</text><text x="500" y="525" text-anchor="middle" class="small">模式図／縮尺・接触角は実測値ではありません</text></svg>