<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>বন্ধু বেছে নেওয়া | X-এর জন্য সংক্ষিপ্ত পোস্ট</title><meta name="description" content="বন্ধুত্ব নিয়ে সহজ ভাষায় সংক্ষিপ্ত বাংলা X পোস্ট।"><link rel="stylesheet" href="../../2026/choosing-friends-20261019/article.css"></head><body><main class="post-main"><nav><a href="index.html">← মূল নিবন্ধে ফিরুন</a></nav><article><h1>X-এর জন্য সংক্ষিপ্ত পোস্ট</h1><p>নিচের লেখাটি কপি করে X-এ পোস্ট করতে পারেন।</p><div class="post" id="post">বন্ধুর প্রভাবে আমাদের চিন্তা ও আচরণ বদলে যেতে পারে। তাই বন্ধু বাছুন ভেবেচিন্তে। সবার প্রতি সদয় থাকুন, তবে খারাপ প্রভাব ফেলে এমন বন্ধুত্ব এড়িয়ে চলুন।</div><p><button type="button" id="copy">লেখাটি কপি করুন</button></p><p id="status" role="status" aria-live="polite"></p><p><a href="index.html">পুরো নিবন্ধ পড়ুন: কেন খারাপ সঙ্গ এড়িয়ে চলা উচিত?</a></p></article></main><script>document.getElementById('copy').addEventListener('click',async()=>{const p=document.getElementById('post');const s=document.getElementById('status');try{await navigator.clipboard.writeText(p.textContent);s.textContent='কপি হয়েছে। এখন X-এ পেস্ট করতে পারেন।';}catch(e){const r=document.createRange();r.selectNodeContents(p);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(r);s.textContent='লেখাটি নির্বাচন করা হয়েছে। কপি করতে Ctrl+C বা আপনার ডিভাইসের কপি অপশন ব্যবহার করুন।';}});</script></body></html>
